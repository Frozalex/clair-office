name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: python3 -m unittest discover -s server -v
      - name: Install conversion engine
        run: sudo apt-get update && sudo apt-get install -y libreoffice-writer libreoffice-impress fonts-liberation
      - name: Verify real Office conversions
        run: python3 server/smoke_office.py
